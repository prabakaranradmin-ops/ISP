{{define "content"}}
{{$d := .Data}}
<h1>Subscribers</h1>
<form class="searchbar" method="get" action="/staff/subscribers">
  <input name="q" value="{{$d.Query}}" placeholder="Username or subscriber id" aria-label="Search subscribers">
  <button class="primary" type="submit">Search</button>
  <a class="btn" href="/staff/subscribers/new">New subscriber</a>
</form>
<p class="muted">{{len $d.Results}} shown of {{$d.Total}} total</p>
<div class="card">
  <table>
    <thead><tr><th>ID</th><th>Username</th><th></th></tr></thead>
    <tbody>
    {{range $d.Results}}
      <tr>
        <td class="num">{{.ID}}</td>
        <td>{{.Username}}</td>
        <td class="right"><a class="btn" href="/staff/subscribers/{{.ID}}">Open</a></td>
      </tr>
    {{else}}
      <tr><td colspan="3" class="empty">No subscribers match.</td></tr>
    {{end}}
    </tbody>
  </table>
</div>
{{end}}
