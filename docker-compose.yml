version: '3.8'

networks:
  bss_internal:
    driver: bridge

services:

  # ── PostgreSQL Primary ──────────────────────────────────────────────────────
  postgres_primary:
    image: postgres:15-alpine
    container_name: bss_postgres_primary
    environment:
      POSTGRES_DB: isp_bss_oss
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_SECURE_PASSWORD}
    volumes:
      - pg_data_primary:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - bss_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d isp_bss_oss"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
    restart: always

  # ── Gotenberg PDF Engine ────────────────────────────────────────────────────
  gotenberg_engine:
    image: gotenberg/gotenberg:8
    container_name: bss_gotenberg_engine
    networks:
      - bss_internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    restart: always

  # ── AAA Core Daemon ─────────────────────────────────────────────────────────
  aaa_core_daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bss_aaa_core_daemon
    depends_on:
      postgres_primary:
        condition: service_healthy
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
      # Host 9100 -> container 9101: config.go's METRICS_ADDR default is
      # :9101 (same as api_service, confirmed by this daemon's own "metrics
      # listening" startup log) — this was previously mapped 9100:9100,
      # which meant the metrics endpoint was never actually reachable on the
      # host at all. Kept at host-side 9100 (distinct from api_service's
      # 9101) so the two services don't collide on the same host port.
      - "9100:9101"   # Prometheus metrics
    volumes:
      # This daemon reads the key store too, not just api_service: the
      # multi-vendor NAS resolver (FR-NAS-002) decrypts each NAS's RADIUS
      # secret with it. AES_KEY_STORE_URL was already set below without this
      # mount, which meant the path resolved to nothing inside the container.
      - ./config/keys:/app/config/keys:ro
    environment:
      # bss_app, not postgres: the app must run as a non-superuser,
      # non-owner role so PostgreSQL RLS (lea_audit_log's append-only
      # policy, migration 014) actually applies to it — a superuser or
      # table owner bypasses RLS entirely regardless of policy. Migrations
      # still run as postgres (see scripts/demo_up.sh); only the running
      # application's own connection uses this least-privilege role.
      - DB_DSN=host=postgres_primary user=bss_app password=${APP_DB_PASSWORD} dbname=isp_bss_oss port=5432 sslmode=disable
      - RADIUS_SECRET=${RADIUS_SECRET}
      - RADIUS_VERIFIER_SECRET=${RADIUS_VERIFIER_SECRET}
      - AES_KEY_STORE_URL=${AES_KEY_STORE_URL}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - SMS_GATEWAY_PROVIDER=${SMS_GATEWAY_PROVIDER}
      - SMS_GATEWAY_API_KEY=${SMS_GATEWAY_API_KEY}
      - SMS_GATEWAY_SENDER_ID=${SMS_GATEWAY_SENDER_ID}
      - PAGERDUTY_ROUTING_KEY=${PAGERDUTY_ROUTING_KEY}
      - LOG_FORMAT=json
      - LOG_LEVEL=info
    networks:
      - bss_internal
    restart: always

  # ── API Service ─────────────────────────────────────────────────────────────
  # Port 8080 is intentionally not published to the host: SecD §9.7 requires
  # it be reachable only from the reverse_proxy container, which terminates
  # TLS and forwards to it over the internal network.
  api_service:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: bss_api_service
    depends_on:
      postgres_primary:
        condition: service_healthy
    expose:
      - "8080"
    ports:
      - "9101:9101"   # Prometheus metrics
    volumes:
      # AES_KEY_STORE_URL below points inside the container at this path.
      # config/keys/*.json is gitignored — generate it before first boot with
      # scripts/demo_up.sh, or by hand (see .env.example).
      - ./config/keys:/app/config/keys:ro
    environment:
      # bss_app, not postgres — see the same note on aaa_core_daemon above.
      - DB_DSN=host=postgres_primary user=bss_app password=${APP_DB_PASSWORD} dbname=isp_bss_oss port=5432 sslmode=disable
      - JWT_SECRET=${JWT_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - AES_KEY_STORE_URL=${AES_KEY_STORE_URL}
      - GOTENBERG_URL=http://gotenberg_engine:3000
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_WEBHOOK_VERIFY_TOKEN=${WHATSAPP_WEBHOOK_VERIFY_TOKEN}
      - SMS_GATEWAY_PROVIDER=${SMS_GATEWAY_PROVIDER}
      - SMS_GATEWAY_API_KEY=${SMS_GATEWAY_API_KEY}
      - SMS_GATEWAY_SENDER_ID=${SMS_GATEWAY_SENDER_ID}
      - LOG_FORMAT=json
      - LOG_LEVEL=info
    networks:
      - bss_internal
    restart: always

  # ── Reverse Proxy (TLS termination — SecD §9.7, IDD §8.1) ───────────────────
  reverse_proxy:
    image: caddy:2-alpine
    container_name: bss_reverse_proxy
    depends_on:
      - api_service
    ports:
      - "443:443"
      - "80:80"   # ACME HTTP-01 challenge; Caddy also uses it to redirect to HTTPS
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    networks:
      - bss_internal
    restart: always

volumes:
  pg_data_primary:
  caddy_data:
  caddy_config:
