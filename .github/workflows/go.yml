# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest exists specifically so the Windows-only
        # build-tagged code (internal/winservice/winservice_windows.go and
        # its test — see cmd/api and cmd/radiusd's Windows service
        # entrypoints) actually gets compiled and run somewhere. Every
        # other job in this repo's history ran on ubuntu-latest alone, so
        # that file — and any bug in it — would only ever have surfaced on
        # a real Windows machine, which is exactly the gap that made the
        # native Windows install's own service registration impossible to
        # verify from this sandboxed environment in the first place.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        # Must be >= the "go" directive in go.mod (currently 1.23, raised
        # there by adding chromedp — see that commit). This pin already
        # predated that: go.mod said 1.22 when this workflow still said
        # 1.20, so `go build` here would have refused before this change
        # too. Kept in sync with go.mod's floor now rather than left
        # further behind it.
        go-version: '1.23'

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    # The integration suite is behind `//go:build integration`, so every
    # other step in this workflow skips it entirely — it is not in `go
    # build ./...`, not in `go vet ./...`, and not in `go test ./...`.
    # That invisibility let it rot until it no longer compiled at all:
    # five interfaces moved (ListSegmentSubscriberIDs gaining an
    # announcement id, ClearSpeedOverride/SetSpeedOverride,
    # GetVoucherCommissionSummary, and the franchise queriers' commission
    # methods) and each left its test double behind, with nothing to
    # report it. The suite did not fail; it could not build.
    #
    # This step is the cheap guard against that recurring. It compiles
    # and vets the tagged files without needing PostgreSQL, so it runs
    # here in seconds while the tests themselves still require the real
    # database that scripts/run_db_tests.sh provisions.
    - name: Vet (integration-tagged tests)
      run: go vet -tags=integration ./...

    - name: Test
      run: go test -v ./...
